<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Orbitron', sans-serif;
        }
        .splash-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #0a0e27 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #00a0ff;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(0, 160, 255, 0.5), inset 0 0 30px rgba(0, 160, 255, 0.1);
            animation: pulseBorder 2s infinite alternate;
        }
        @keyframes pulseBorder {
            from { box-shadow: 0 0 40px rgba(0, 160, 255, 0.3); }
            to { box-shadow: 0 0 80px rgba(0, 160, 255, 0.7); }
        }
        .title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00a0ff, #0055ff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 160, 255, 0.5);
            animation: glitch 1.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0); }
        }
        .subtitle {
            color: #00a0ff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .tip-box {
            background: rgba(0, 160, 255, 0.1);
            border: 1px solid #00a0ff;
            border-radius: 12px;
            padding: 12px 24px;
            margin-bottom: 30px;
            max-width: 400px;
            text-align: center;
            color: #a0d0ff;
            font-size: 0.9rem;
            transition: opacity 0.5s ease;
            min-height: 50px;
            display: flex;
            align-items: center;
        }
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, #00a0ff, #0055ff);
            border-radius: 10px;
            animation: loading 2.5s ease-in-out infinite;
        }
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="title">⚡ FlashForge</div>
        <div class="subtitle">IGNITING THE FUTURE</div>
        <div class="tip-box" id="tipText">Loading...</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>

    <script>
        
        const tips = [
            "💡 Tip: DD mode ensures better compatibility with Linux distributions.",
            "⚡ Tip: Checking for bad blocks can extend your drive's life.",
            "🔒 Security: Always verify the SHA-256 of any ISO before burning.",
            "🚀 Speed: Quick format saves time, but full format is more thorough.",
            "🐧 Linux: Use ext4 filesystem for better Linux performance.",
            "💻 Windows: Bypass TPM 2.0 to install Windows 11 on older PCs.",
            "🛡️ Feature: Windows To Go turns your USB into a portable OS.",
            "📀 Burning: Do not remove the USB during the burning process.",
            "🧹 Maintenance: Use Repair Mode to fix filesystem errors.",
            "🌐 Download: Download Windows ISO directly from Microsoft for safety."
        ];

        let tipIndex = Math.floor(Math.random() * tips.length);
        const tipElement = document.getElementById('tipText');
        
        tipElement.textContent = tips[tipIndex];
        
        setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            tipElement.style.opacity = '0';
            setTimeout(() => {
                tipElement.textContent = tips[tipIndex];
                tipElement.style.opacity = '1';
            }, 500);
        }, 3000);
    </script>
</body>
</html>
